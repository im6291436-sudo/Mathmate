<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="118" fill="url(#glow)" />

  <!-- Subtle border stroke -->
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Mathmate Signature Bold Sigma (Σ) Symbol -->
  <path d="M 148,136 L 364,136 L 364,196 L 268,196 L 322,256 L 254,320 L 364,320 L 364,380 L 148,380 L 244,256 Z"
        fill="url(#symbolGrad)" />

  <!-- Sparkle & Accent Dots -->
  <circle cx="364" cy="150" r="16" fill="#f59e0b" />
  <path d="M 342,356 L 386,356 M 364,334 L 364,378" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
</svg>