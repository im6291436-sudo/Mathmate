    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

        </div>

        <div id="loading-status" style="font-size: 13px; color: #94a3b8; margin-top: 8px;">লোড হচ্ছে...</div>
        <div id="loading-fallback" style="display: none; margin-top: 16px; text-align: center;">
          <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 10px;">লোড হতে সময় নিচ্ছে?</p>
          <button onclick="window.cleanAndReload()" style="background: linear-gradient(135deg, #6366f1, #9333ea); color: #fff; border: none; padding: 8px 18px; border-radius: 9999px; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(99,102,241,0.4);">
            🔄 ক্যাশ মুছে পুনরায় চালু করুন
          </button>
        </div>
      </div>
    </div>
    <script>
      // Clean and reload helper
      window.cleanAndReload = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
        setTimeout(function() {
          window.location.reload(true);
        }, 300);
      };

      // Watchdog: If React hasn't mounted in 3.5s, display retry action
      setTimeout(function() {
        if (!window.__MATHMATE_MOUNTED__) {
          var fb = document.getElementById('loading-fallback');
          if (fb) fb.style.display = 'block';
        }
      }, 3500);

      // Catch any unexpected JS syntax/loading error
      window.addEventListener('error', function(e) {
        console.warn('Script error during load:', e.message);
        var st = document.getElementById('loading-status');
        var fb = document.getElementById('loading-fallback');
        if (st) st.textContent = 'নেটওয়ার্ক বা ক্যাশ রিফ্রেশ প্রয়োজন';
        if (fb) fb.style.display = 'block';
      });
    </script>
